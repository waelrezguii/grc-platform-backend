name: CI Security Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ─── Job 1: Build, Test, SAST, SCA ───────────────────────────────────────
  build:
    name: Build & Static Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: riskbdd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw clean package -DskipTests

      - name: Run tests
        run: ./mvnw test -e
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: riskbdd
          DB_HOST: localhost
          DB_PORT: 5432

      - name: SpotBugs SAST
        run: ./mvnw compile com.github.spotbugs:spotbugs-maven-plugin:4.9.3.0:check


  # ─── Job 2: Docker Build + Trivy Container Scan ──────────────────────────
  trivy:
    name: Docker + Trivy Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t grc-app:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: grc-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          timeout: 10m

  # ─── Job 3: DAST with OWASP ZAP ──────────────────────────────────────────
  zap:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: trivy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=riskbdd" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "APP_FRONTEND_URL=http://localhost:4200" >> .env
          echo "APP_BACKEND_URL=http://localhost:8080" >> .env
          echo "JPA_SHOW_SQL=false" >> .env

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          echo "App failed to start" && exit 1

      - name: Verify Actuator health
        run: curl --fail http://localhost:8080/actuator/health

      - name: Run ZAP API scan
        run: |
          chmod 777 ${{ github.workspace }}
          docker run --rm --network host \
            -v ${{ github.workspace }}:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Stop stack
        if: always()
        run: docker compose down -v
