# Test-profile overrides — only active with @ActiveProfiles("test")
# Provides safe fallbacks so the context loads without real external services.

# Use env var when set (CI injects it); fall back to a deterministic test key
jwt.secret=${JWT_SECRET:dGVzdFNlY3JldEtleUZvclRlc3Rpbmc5ODc2NTQzMjE=}

# Stub mail — bean is created but never actually connects in unit tests
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=25
spring.mail.username=${MAIL_USERNAME:test@test.com}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# DB — use env vars supplied by the service container; safe defaults for local
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riskbdd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
