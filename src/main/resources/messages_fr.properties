# ── OTP ───────────────────────────────────────────────────────────────
email.otp.subject=Votre code de connexion GRC
email.otp.body=Bonjour {0},\n\nVotre code de connexion \u00e0 usage unique est :\n\n    {1}\n\nCe code expire dans 5 minutes.\nSi vous n\u2019avez pas tent\u00e9 de vous connecter, contactez imm\u00e9diatement votre administrateur.

# ── Welcome ───────────────────────────────────────────────────────────
email.welcome.subject=Votre compte GRC
email.welcome.body=Bonjour {0},\n\nVotre compte sur la plateforme GRC a \u00e9t\u00e9 cr\u00e9\u00e9 par un administrateur.\n\nIdentifiants de connexion :\n  Email :              {1}\n  Mot de passe temporaire : {2}\n\nIMPORTANT : Vous devrez changer votre mot de passe lors de votre premi\u00e8re connexion.\n\nAcc\u00e9dez \u00e0 la plateforme sur : http://localhost:4200\n\nSi vous n\u2019avez pas demand\u00e9 ce compte, contactez votre administrateur.

# ── New device alert (to user) ────────────────────────────────────────
email.newdevice.subject=Alerte de s\u00e9curit\u00e9 \u2014 Nouvelle connexion d\u00e9tect\u00e9e
email.newdevice.body=Bonjour {0},\n\nUne connexion \u00e0 votre compte GRC a \u00e9t\u00e9 d\u00e9tect\u00e9e depuis {1}.\n\n  Heure :    {2}\n  Appareil : {3}\n  IP :       {4}\n\nSi c\u2019\u00e9tait vous, aucune action n\u2019est n\u00e9cessaire.\nSi vous ne reconnaissez pas cette activit\u00e9, contactez imm\u00e9diatement votre administrateur.
email.newdevice.detail.both=un nouvel appareil et un nouvel emplacement (IP : {0})
email.newdevice.detail.device=un nouvel appareil
email.newdevice.detail.ip=un nouvel emplacement (IP : {0})

# ── Admin security alert ──────────────────────────────────────────────
email.admin.security.subject=Alerte de s\u00e9curit\u00e9 \u2014 Connexion suspecte pour {0}
email.admin.security.body=Bonjour {0},\n\nUne connexion a \u00e9t\u00e9 d\u00e9tect\u00e9e pour l\u2019utilisateur {1} depuis {2}.\n\n  Heure :    {3}\n  Appareil : {4}\n  IP :       {5}\n\nVeuillez examiner cette activit\u00e9 dans les journaux d\u2019audit de la plateforme GRC.

# ── Password reset ────────────────────────────────────────────────────
email.reset.subject=Demande de r\u00e9initialisation de mot de passe \u2014 GRC
email.reset.body=Bonjour {0},\n\nUne r\u00e9initialisation de mot de passe a \u00e9t\u00e9 demand\u00e9e pour votre compte GRC.\n\nR\u00e9initialisez votre mot de passe (expire dans 30 minutes) :\n  {1}\n\nVous n\u2019avez pas fait cette demande ? Annulez imm\u00e9diatement pour s\u00e9curiser votre compte :\n  {2}\n\nSi vous annulez, votre mot de passe restera inchang\u00e9.

email.reset.confirmed.subject=R\u00e9initialisation de mot de passe r\u00e9ussie \u2014 GRC
email.reset.confirmed.body=Bonjour {0},\n\nVotre mot de passe GRC a \u00e9t\u00e9 modifi\u00e9 avec succ\u00e8s.\n\nSi vous n\u2019avez pas effectu\u00e9 cette action, contactez imm\u00e9diatement votre administrateur.

email.reset.cancelled.subject=R\u00e9initialisation de mot de passe annul\u00e9e \u2014 GRC
email.reset.cancelled.body=Bonjour {0},\n\nVotre demande de r\u00e9initialisation de mot de passe a \u00e9t\u00e9 annul\u00e9e avec succ\u00e8s.\nVotre mot de passe reste inchang\u00e9.\n\nSi vous n\u2019avez pas annul\u00e9 cela, contactez imm\u00e9diatement votre administrateur.

# ── Scanner sync failure ──────────────────────────────────────────────
email.sync.failure.subject=\u00c9chec de synchronisation \u2014 {0}
email.sync.failure.body=Bonjour {0},\n\nLa synchronisation planifi\u00e9e avec le scanner \u00ab {1} \u00bb ({2}) a \u00e9chou\u00e9.\n\nErreur : {3}\n\nVeuillez v\u00e9rifier la configuration et la connectivit\u00e9 du scanner dans la plateforme GRC.\nLes journaux sont disponibles sur : http://localhost:4200/scanners

# ── Asset end-of-life ─────────────────────────────────────────────────
email.eol.past.subject=Action requise \u2014 Actif hors dur\u00e9e de vie : {0}
email.eol.past.body=Bonjour {0},\n\nL\u2019actif {1} \u2014 {2} a d\u00e9pass\u00e9 sa date de fin de vie ({3}) et n\u00e9cessite une action imm\u00e9diate.\n\nVeuillez examiner et mettre \u00e0 jour le statut du cycle de vie dans la plateforme GRC.

email.eol.approaching.subject=Actif approchant de sa fin de vie : {0}
email.eol.approaching.body=Bonjour {0},\n\nL\u2019actif {1} \u2014 {2} atteindra sa date de fin de vie le {3} (encore {4} jour(s)).\n\nVeuillez planifier la transition de cycle de vie appropri\u00e9e dans la plateforme GRC.
