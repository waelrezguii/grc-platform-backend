# ── Validation ────────────────────────────────────────────────────────
validation.required=This field is required
validation.email=Must be a valid email address

# ── Auth errors ───────────────────────────────────────────────────────
error.invalid_credentials=Invalid email or password
error.account_disabled=Your account has been disabled. Contact your administrator
error.account_locked=Account temporarily locked. Try again in {0} minute(s)
error.invalid_domain=Email must belong to the organisation domain (@company.com)
error.invalid_otp=Invalid verification code
error.otp_expired=Verification code has expired. Please log in again

# ── General errors ────────────────────────────────────────────────────
error.user_not_found=User not found
error.email_exists=This email address is already in use
error.role_not_found=Role not found
error.organisation_not_found=Organisation not found
error.internal=An unexpected error occurred

# ── OTP ───────────────────────────────────────────────────────────────
email.otp.subject=Your GRC Platform Login Code
email.otp.body=Hello {0},\n\nYour one-time login code is:\n\n    {1}\n\nThis code expires in 5 minutes.\nIf you did not attempt to log in, please contact your administrator immediately.

# ── Welcome ───────────────────────────────────────────────────────────
email.welcome.subject=Your GRC Platform Account
email.welcome.body=Hello {0},\n\nYour account on the GRC Platform has been created by an administrator.\n\nLogin credentials:\n  Email:              {1}\n  Temporary password: {2}\n\nIMPORTANT: You will be required to change your password on first login.\n\nAccess the platform at: http://localhost:4200\n\nIf you did not request this account, please contact your administrator.

# ── New device alert (to user) ────────────────────────────────────────
email.newdevice.subject=Security Alert \u2014 New Login Detected
email.newdevice.body=Hello {0},\n\nA login to your GRC Platform account was detected from {1}.\n\n  Time:   {2}\n  Device: {3}\n  IP:     {4}\n\nIf this was you, no action is needed.\nIf you do not recognise this activity, contact your administrator immediately.
email.newdevice.detail.both=a new device and a new location (IP: {0})
email.newdevice.detail.device=a new device
email.newdevice.detail.ip=a new location (IP: {0})

# ── Admin security alert ──────────────────────────────────────────────
email.admin.security.subject=Security Alert \u2014 Suspicious Login for {0}
email.admin.security.body=Hello {0},\n\nA login was detected for user {1} from {2}.\n\n  Time:   {3}\n  Device: {4}\n  IP:     {5}\n\nPlease review this activity in the GRC Platform audit logs.

# ── Password reset ────────────────────────────────────────────────────
email.reset.subject=Password Reset Request \u2014 GRC Platform
email.reset.body=Hello {0},\n\nA password reset was requested for your GRC Platform account.\n\nReset your password (expires in 30 minutes):\n  {1}\n\nDid NOT request this? Cancel immediately to keep your account secure:\n  {2}\n\nIf you cancel, your password will remain unchanged.

email.reset.confirmed.subject=Password Reset Successful \u2014 GRC Platform
email.reset.confirmed.body=Hello {0},\n\nYour GRC Platform password has been changed successfully.\n\nIf you did not perform this action, contact your administrator immediately.

email.reset.cancelled.subject=Password Reset Cancelled \u2014 GRC Platform
email.reset.cancelled.body=Hello {0},\n\nYour password reset request has been cancelled successfully.\nYour password remains unchanged.\n\nIf you did not cancel this, contact your administrator immediately.

# ── Scanner sync failure ──────────────────────────────────────────────
email.sync.failure.subject=Scanner Sync Failed \u2014 {0}
email.sync.failure.body=Hello {0},\n\nThe scheduled synchronization with scanner "{1}" ({2}) has failed.\n\nError: {3}\n\nPlease check the scanner configuration and connectivity in the GRC Platform.\nSync logs are available at: http://localhost:4200/scanners

# ── Asset end-of-life ─────────────────────────────────────────────────
email.eol.past.subject=Action Required \u2014 Asset Past End-of-Life: {0}
email.eol.past.body=Hello {0},\n\nAsset {1} \u2014 {2} has passed its end-of-life date ({3}) and requires immediate action.\n\nPlease review and update the asset lifecycle status in the GRC Platform.

email.eol.approaching.subject=Asset Approaching End-of-Life: {0}
email.eol.approaching.body=Hello {0},\n\nAsset {1} \u2014 {2} will reach its end-of-life date on {3} ({4} day(s) remaining).\n\nPlease plan the appropriate lifecycle transition in the GRC Platform.
